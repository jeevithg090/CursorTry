[project]
name = "hydpyhack2025"
version = "0.2.0"
description = "BulBul: a voice-first fintech agent that pitches matching credit cards and answers questions using Sarvam AI."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Akhil" }]
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.2.3",
    "python-dotenv>=1.0.1",
    "requests>=2.32.4",
    "scipy>=1.15.1",
    "sounddevice>=0.5.1",
    "yoyo-migrations>=9.0.0",
]

[project.scripts]
bulbul = "fintechagent.cli:main"

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pytest>=8.3.4",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "types-requests>=2.32",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["fintechagent"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PL", "S"]
ignore = ["PLR2004", "PLR0913", "PLR0911"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "PLC0415"]
"fintechagent/audio.py" = ["PLC0415"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["fintechagent"]

[[tool.mypy.overrides]]
module = ["sounddevice", "scipy.*", "yoyo.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -m 'not live'"
markers = [
    "live: calls the real Sarvam API and audio devices (run with `-m live`, needs SARVAM_AI_API)",
]
